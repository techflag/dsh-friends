<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DSH 搭子 · 视觉规范</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="ui-system.css"><link rel="stylesheet" href="style-guide.css"></head><body><main id="main" class="visual-guide"><header><a href="/#lobby">← 返回原型</a><h1>一种风格，贯穿每个页面。</h1><p>DSH 搭子 · 原型视觉规范与组件样式示例</p></header><section><h2>颜色各司其职</h2><div class="swatches"><div><i class="swatch-nav"></i><b>导航紫色渐变</b><p>社区外壳与频道导航</p></div><div><i class="swatch-action"></i><b>柔和紫色</b><p>主按钮、焦点与链接 · 浅紫选中</p></div><div><i class="swatch-surface"></i><b>白色与浅灰紫</b><p>内容、表单与分隔</p></div><div><i class="swatch-danger"></i><b>危险红色</b><p>删除和不可恢复的操作</p></div></div></section><section><h2>按钮有明确层次</h2><div class="samples"><button class="button primary">主要操作</button><button class="button">次要操作</button><button class="text-button">文字操作 →</button><button class="button danger">危险操作</button><button class="button primary" disabled>暂不可用</button></div><p class="caption">主要操作保持突出，其余操作按重要程度减弱。悬停、按下、键盘焦点和禁用均使用共用规则。</p></section><section><h2>表单与提示</h2><div class="fields"><label class="field">昵称<input placeholder="例如：林间"></label><label class="field">一句话介绍<input value="用 DSH 做点顺手的小工具"></label></div><div class="guide-note">普通说明使用浅色背景；警告与错误保留独立语义，不用主操作色代替。</div></section><footer>以上为样式示例。配色固定，不随系统切换；原型人物与数据均为演示。</footer></main></body></html>
