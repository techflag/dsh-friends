name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-friends-development-package
          path: dsh-friends-*.tgz
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check offline prototype
        run: |
          npm run preview > /tmp/dsh-friends-preview.log 2>&1 &
          npm run test:design
